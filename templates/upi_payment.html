
{% extends "base.html" %}
{% block title %}UPI Payment - PetCareConnect{% endblock %}

{% block content %}
<div class="container mt-5 text-center">
    <div class="card shadow-lg p-4 rounded-4" style="max-width: 500px; margin: 0 auto;">
        <h2 class="text-success mb-3"><i class="fas fa-money-bill-wave"></i> UPI Payment</h2>

        <p class="lead">Please scan the QR code or use the UPI ID below to complete your payment.</p>
        <hr>

        <img src="{{ url_for('static', filename='uploads/QRcode.png') }}" 
             alt="UPI QR Code" 
             class="img-fluid rounded-3 mb-3" 
             style="max-width: 250px;">

        <h5><strong>UPI ID:</strong> <span class="text-primary">{{ upi_id }}</span></h5>
        <p><strong>Amount:</strong> ₹{{ order.total_amount }}</p>

        <form method="post" action="{{ url_for('confirm_payment', order_number=order.order_number) }}">
    <button type="submit" class="btn btn-success mt-3 px-4">I have paid</button>
</form>


        <a href="{{ url_for('my_orders') }}" class="btn btn-link mt-2">View My Orders</a>
    </div>
</div>
{% endblock %}
